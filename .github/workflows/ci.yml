name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scanlark
          POSTGRES_PASSWORD: scanlark_ci
          POSTGRES_DB: scanlark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanlark -d scanlark_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc)
        if: ${{ hashFiles('.nvmrc') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Node (default)
        if: ${{ hashFiles('.nvmrc') == '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Node version
        run: node -v

      - name: NPM version
        run: npm -v

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Format check
        run: npm run format:check

      - name: Apply disposable test migrations
        env:
          DATABASE_URL: postgresql://scanlark:scanlark_ci@127.0.0.1:5432/scanlark_test
          NODE_ENV: test
        run: bash scripts/run-migrations.sh

      - name: Workspace tests
        env:
          DATABASE_URL: postgresql://scanlark:scanlark_ci@127.0.0.1:5432/scanlark_test
          NODE_ENV: test
        run: npm --workspaces run test --if-present

      - name: Workspace typecheck
        run: npm --workspaces run typecheck --if-present

      - name: Workspace lint
        run: npm --workspaces run lint --if-present

      - name: Workspace build
        run: npm --workspaces run build --if-present

      - name: Root typecheck
        run: npm run typecheck --if-present

      - name: Root lint
        run: npm run lint --if-present

      - name: Root build
        run: npm run build --if-present
