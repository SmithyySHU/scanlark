<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scanlark Email Clipboard Fixture</title>
    <style>
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        margin: 24px;
        color: #172033;
        background: #f5f7fb;
      }
      main {
        display: grid;
        gap: 16px;
        max-width: 980px;
      }
      #paste-target {
        min-height: 320px;
        padding: 18px;
        border: 1px solid #b8c2d6;
        background: #ffffff;
      }
      pre {
        overflow: auto;
        padding: 12px;
        background: #111827;
        color: #f9fafb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Scanlark Email Clipboard Fixture</h1>
      <div id="paste-target" contenteditable="true">
        Paste formatted email here.
      </div>
      <pre id="diagnostics">Paste diagnostics will appear here.</pre>
    </main>
    <script>
      const target = document.getElementById("paste-target");
      const diagnostics = document.getElementById("diagnostics");
      target.addEventListener("paste", (event) => {
        const html = event.clipboardData.getData("text/html");
        const plain = event.clipboardData.getData("text/plain");
        window.setTimeout(() => {
          diagnostics.textContent = JSON.stringify(
            {
              mimeTypes: event.clipboardData.types,
              hasHtml: html.length > 0,
              hasPlainText: plain.length > 0,
              hasTable: /<table[\s>]/i.test(html),
              hasStyle: /style=/i.test(html),
              hasLogoImage: /<img[^>]+Scanlark/i.test(html),
              hasPublicLogoUrl:
                /https:\/\/scanlark\.com\/assets\/email\/[^"'\s>]+\.png/i.test(
                  html,
                ),
              hasEditedSentence: html.includes(
                "COMMUNICATIONS PREVIEW TEST 4837",
              ),
              rawTagsVisible: target.textContent.includes("<table"),
            },
            null,
            2,
          );
        }, 0);
      });
    </script>
  </body>
</html>
